<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f6f8fa; --ink:#16202b; --muted:#5b6876; --line:#d9e0e7; --line2:#e8edf2;
  --accent:#2f4bd8; --accent-ink:#ffffff; --accent-tint:#e6eaff;
  --red:#c6392b; --red-tint:#fbe7e4; --amber:#b9780c; --amber-tint:#fbefd5; --green:#2b7d58; --green-tint:#e0f1e8; --blue:#3f6fb5; --blue-tint:#e3edf9;
  --c-commit:#2f4bd8; --c-pipe:#9fb0f2; --c-fl:#2b9a8f; --c-open:#e0a526; --c-past:#8493a5; --c-cap:#16202b;
  --heat-room:#cfe0f5; --heat-ok:#d4ecdf; --heat-warn:#f6dd9f; --heat-hot:#ee9d92; --heat-none:#eef1f4;
  --shadow:0 1px 2px rgba(22,32,43,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151c; --surface:#171f29; --surface2:#1c2632; --ink:#e8edf3; --muted:#93a1b1; --line:#2b3745; --line2:#222d3a;
    --accent:#7d93ff; --accent-ink:#0f151c; --accent-tint:#222c55;
    --red:#ff8d7e; --red-tint:#3a1f1c; --amber:#f0b84e; --amber-tint:#3a2e14; --green:#6fcf9f; --green-tint:#173326; --blue:#8db4ee; --blue-tint:#1a2a40;
    --c-commit:#7d93ff; --c-pipe:#46508f; --c-fl:#4cc3b6; --c-open:#f0b84e; --c-past:#6f7f92; --c-cap:#e8edf3;
    --heat-room:#27415f; --heat-ok:#1f4a37; --heat-warn:#5c4a1c; --heat-hot:#7d3028; --heat-none:#1c2632;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#171f29; --surface2:#1c2632; --ink:#e8edf3; --muted:#93a1b1; --line:#2b3745; --line2:#222d3a;
  --accent:#7d93ff; --accent-ink:#0f151c; --accent-tint:#222c55;
  --red:#ff8d7e; --red-tint:#3a1f1c; --amber:#f0b84e; --amber-tint:#3a2e14; --green:#6fcf9f; --green-tint:#173326; --blue:#8db4ee; --blue-tint:#1a2a40;
  --c-commit:#7d93ff; --c-pipe:#46508f; --c-fl:#4cc3b6; --c-open:#f0b84e; --c-past:#6f7f92; --c-cap:#e8edf3;
  --heat-room:#27415f; --heat-ok:#1f4a37; --heat-warn:#5c4a1c; --heat-hot:#7d3028; --heat-none:#1c2632;
  --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px}
h2{font-size:18px;margin-bottom:4px}
h3{font-size:15px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px 0;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end;justify-content:space-between}
.title small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:2px;margin-bottom:-1px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:500;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab:hover{color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sub{color:var(--muted);font-size:13px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.fact b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.fact span{color:var(--muted);font-size:13px}
.fact.red b{color:var(--red)} .fact.amber b{color:var(--amber)}
.stand{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.stand li{padding-left:14px;position:relative}
.stand li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;text-align:left;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--ink)}
th .arr{opacity:.7;margin-left:3px}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.num,th.num{text-align:right}
tr[data-open]{cursor:pointer}
tr[data-open]:hover td{background:var(--surface2)}
tr[data-open]:focus-visible{outline-offset:-2px}
.name b{font-weight:600}
.name span{display:block;color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.red{background:var(--red-tint);color:var(--red)} .pill.amber{background:var(--amber-tint);color:var(--amber)}
.pill.green{background:var(--green-tint);color:var(--green)} .pill.room{background:var(--blue-tint);color:var(--blue)}
.pill.na{background:var(--surface2);color:var(--muted)}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:6px;white-space:nowrap}
.strip{display:flex;gap:2px}
.cell{min-width:38px;height:28px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:var(--ink)}
.cell.room{background:var(--heat-room)} .cell.ok{background:var(--heat-ok)} .cell.warn{background:var(--heat-warn)} .cell.hot{background:var(--heat-hot)} .cell.none{background:var(--heat-none);color:var(--muted)}
.striplabels{display:flex;gap:2px;margin-bottom:3px}
.striplabels span{min-width:38px;text-align:center;font-size:11px;color:var(--muted)}
.bar{height:8px;background:var(--line2);border-radius:4px;position:relative;min-width:90px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.controls label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
select,input[type=search]{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;font-size:13.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend em{display:inline-block;width:16px;border-top:2px solid var(--c-cap);margin-right:5px;vertical-align:3px}
.legend em.dash{border-top-style:dashed}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.note{background:var(--surface2);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 6px 6px 0;font-size:14px;margin-bottom:14px}
.note.warn{border-left-color:var(--amber)}
.drawer-back{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:40;display:none}
.drawer-back.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:41;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px));box-shadow:-8px 0 30px rgba(0,0,0,.2);transform:translateX(102%)}
.drawer.on{transform:none}
@media (prefers-reduced-motion: no-preference){.drawer{transition:transform .18s ease-out}}
.drawer-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.close{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:5px 11px;font-size:13.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kv div{background:var(--surface2);border-radius:6px;padding:8px 10px}
.kv b{display:block;font-size:18px;font-weight:600}
.kv span{font-size:12.5px;color:var(--muted)}
.reasons{margin:0 0 14px;padding-left:18px}
.reasons li{margin:2px 0}
.small{font-size:13px;color:var(--muted)}
.cols{columns:2 340px;column-gap:28px}
.cols h3{margin:14px 0 4px;break-after:avoid}
.cols ul{margin:0 0 6px;padding-left:18px}
.cols li{margin:3px 0;break-inside:avoid}
.pos{color:var(--red)} .neg{color:var(--green)}

.strow{display:grid;grid-template-columns:150px minmax(260px,1fr) 150px;gap:10px;align-items:center;padding:2px 0;border-top:1px solid var(--line2)}
.strow.axisrow{border-top:0}
.stname{font-size:14px}
.strip-svg{width:100%;height:auto;display:block}
.strip-svg circle{cursor:pointer}
.strip-svg circle:hover{stroke:var(--ink);stroke-width:1.5}
.cnt{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.cnt .hot b{color:var(--red)} .cnt .cool b{color:var(--blue)}
.comp{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line2)}
.comp i{display:block;height:100%}
.bd{font-weight:500} .bd.far{color:var(--red);font-weight:700} .bd.over{color:var(--amber);font-weight:700} .bd.under{color:var(--blue);font-weight:700}
@media (max-width:760px){.strow{grid-template-columns:1fr}.cnt{margin-bottom:6px}}
@media (max-width:640px){main{padding:14px}.top-in{padding:12px 14px 0}.panel{padding:14px}}

.vgrid{display:grid;grid-template-columns:130px repeat(3,minmax(0,1fr));gap:2px 16px;align-items:center}
.vgrid .vh{font-weight:600;font-size:14px;padding-bottom:2px}
.vgrid .cell2{padding:2px 0 4px;border-top:1px solid var(--line2)}
.vgrid .vcap{display:none;font-size:12.5px;color:var(--muted);margin:4px 0 0}
.vgrid .cnt{margin-top:-2px}
circle.hl{stroke:var(--ink)!important;stroke-width:2.6!important}
.flags{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.flags select{padding:3px 6px}
@media (max-width:900px){.vgrid{grid-template-columns:1fr}.vgrid .vh,.vgrid .axiscell{display:none}.vgrid .vcap{display:block}.vgrid .stname{margin-top:10px}}

/* freelance view */
.tabs .tab{font-size:14.5px}
.capgrid th[scope=row]{white-space:nowrap;padding-right:14px}
.capgrid th[scope=row] b{display:block;color:var(--ink);font-weight:600;font-size:14px}
.capgrid th[scope=row] span,.capgrid td.num span{display:block;color:var(--muted);font-size:12px;font-weight:400}
.capgrid td.fc{padding:2px}
.capgrid td.fc button{width:100%;min-width:46px;height:38px;border:0;border-radius:4px;background:transparent;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.capgrid td.fc button:hover{outline:2px solid var(--accent);outline-offset:-2px}
.capgrid td.h-hot button{background:var(--heat-hot)} .capgrid td.h-warn button{background:var(--heat-warn)}
.capgrid td.h-ok button{background:var(--heat-ok)} .capgrid td.h-room button{background:var(--heat-room)}
.capgrid td.h-none button{background:var(--heat-none)}
.capgrid tr.allrow th,.capgrid tr.allrow td{border-bottom:2px solid var(--line)}
.capgrid tr.allrow td.fc button{font-weight:700}
.lvrow{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:8px 20px;padding:12px 0;border-bottom:1px solid var(--line2)}
.lvname b{display:block;font-weight:600} .lvname span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.lvbars{display:grid;gap:6px}
.lvbar{display:grid;grid-template-columns:72px 1fr 120px;gap:10px;align-items:center;font-size:13px}
.lvbar .lbl{color:var(--muted)} .lvbar .val{text-align:right;font-variant-numeric:tabular-nums}
.trk{display:block;height:12px;background:var(--surface2);border-radius:3px;overflow:hidden}
.trk i{display:block;height:100%;border-radius:3px;background:var(--c-fl)}
td.barcell{min-width:120px}
.lvrow.sel{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.lvlbar{padding:12px 20px}
.topright{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.gatechk{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;padding-bottom:12px;white-space:nowrap}
@media (max-width:640px){.lvrow{grid-template-columns:1fr}.lvbar{grid-template-columns:64px 1fr 96px}}
</style>
</head>

const DEPTS=["Account","Creative","Delivery","Design","Production","Studio","Strategy"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(n,d=0)=>(n==null||isNaN(n))?"–":Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const wkLabel=iso=>{const d=new Date(iso+"T00:00:00");return MON[d.getMonth()]+" "+d.getDate()};
const median=a=>{a=a.filter(v=>v!=null&&!isNaN(v)).sort((x,y)=>x-y);if(!a.length)return null;const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2};
const P=D.people; P.forEach((p,i)=>p.id=i);
const PER={latest:[37,44],Q1:[2,13],Q2:[14,26],Q3:[27,39],Q4:[40,44],ytd:[2,44]};
const PBTN=[["latest","Latest"],["Q1","Q1"],["Q2","Q2"],["Q3","Q3"],["Q4","Q4 to date"],["ytd","Year to date"]];
const PLAB={latest:"the last 8 weeks",Q1:"Q1 (Jan to Mar)",Q2:"Q2 (Apr to Jun)",Q3:"Q3 (Jul to Sep)",Q4:"Q4 to date (through Oct 31)",ytd:"the year to date"};
const WKS={latest:43.4,ytd:43.4,Q1:12,Q2:13,Q3:13,Q4:5};
const ST={gate:true,m:"h",per:"latest",dept:"All",lvl:"All",q:"",all:true,hc:"all",thr:{b:40,bn:43,all:45},thrP:4,thrT:10,thrB:5,dq:"L8",dp:null,sort:{key:"h",dir:-1}};

/* ---------- measures ---------- */
function qual(p,per){const [w0,w1]=PER[per],idx=[];for(let wk=w0;wk<=w1;wk++){if((p.hw[wk-2]||0)>=8)idx.push(wk-2)}return idx.length>=Math.min(3,Math.ceil((w1-w0+1)/2))?idx:null}
function hoursFor(p,per){const idx=qual(p,per);if(!idx)return null;const avg=a=>idx.reduce((s,i)=>s+(a[i]||0),0)/idx.length;const b=avg(p.hs)+avg(p.hu),nb=avg(p.hn),inn=avg(p.hi);return {t:avg(p.hw),b:b,nb:nb,bn:b+nb,in:inn}}
function projFor(p,per){const [w0,w1]=PER[per],c=ST.all?p.cA:p.cC,l=ST.all?p.lA:p.lC;let n=0,s=0;for(let wk=w0;wk<=w1;wk++){const t=(c[wk-2]||0)+(l[wk-2]||0);if(t>0){n++;s+=t}}return n?s/n:null}
function bigFor(p,per){const key=per==="latest"?"last8":per,e=p.sz&&p.sz[ST.all?"all":"client"],a=e&&e[key];return a?a[2]+a[3]:null}
function offFor(p,per){if(per==="latest"||per==="ytd")return (p.pcY!=null&&p.capY&&p.capY>=1400)?p.pcY:null;return (p.pcQ&&p.pcQ[per]!=null)?p.pcQ[per]:null}
const HC=[["all","Total hours"],["b","Billable only"],["bn","Billable + new business"]];
const hcLabel=()=>HC.find(x=>x[0]===ST.hc)[1];
const thrH=()=>ST.thr[ST.hc];
const hoursSel=h=>ST.hc==="b"?h.b:ST.hc==="bn"?h.bn:h.t;
const bandH=v=>v>thrH()+5?"far":v>thrH()?"over":v<thrH()-10?"under":"ok";
const BVK={latest:"L8",Q1:"Q1",Q2:"Q2",Q3:"Q3",Q4:"Q4",ytd:"ytd"};
function bvFor(p,per){const k=BVK[per],t=p.bv&&p.bv[k];if(!t||t[0]<((k==="L8"||k==="Q4")?2:3))return null;return {n:t[0],b:t[1]/t[0],w:t[2]/t[0],d:(t[2]-t[1])/t[0]}}
const bandB=v=>v>=2*ST.thrB?"far":v>=ST.thrB?"over":v<=-ST.thrB?"under":"ok";
const bandP=v=>v>=ST.thrP+1?"far":v>=ST.thrP?"over":"ok";
const offThr=()=>ST.thrT*WKS[ST.per]/43.4;
const fullYear=()=>ST.per==="latest"||ST.per==="ytd";
const bandT=v=>!fullYear()?"ok":v<offThr()/2?"far":v<offThr()?"over":"ok";
function measures(){
  const hi=Math.max(4,Math.ceil(40*WKS[ST.per]/43.4/2)*2), step=hi>=30?10:hi>=12?4:2;
  const tt=[];for(let v=0;v<=hi;v+=step)tt.push(v);
  return [
    {k:"h",title:"Hours per week, "+hcLabel().toLowerCase(),get:p=>{const h=hoursFor(p,ST.per);return h?hoursSel(h):null},band:bandH,lo:ST.hc==="all"?20:ST.hc==="bn"?15:10,hi:65,ticks:ST.hc==="all"?[20,30,40,50,60]:ST.hc==="bn"?[20,30,40,50,60]:[10,20,30,40,50,60],fmt:v=>fmt(v,1),hot:"over",cool:"under"},
    {k:"p",title:"Projects at once",get:p=>projFor(p,ST.per),band:bandP,lo:0,hi:8,ticks:[0,2,4,6,8],fmt:v=>fmt(v,1),hot:"over",cool:null},
    {k:"t",title:fullYear()?"Time off, days this year":"Time off, days in the quarter",get:p=>offFor(p,ST.per),band:bandT,lo:0,hi:hi,ticks:tt,fmt:v=>fmt(v,1),hot:fullYear()?"low":null,cool:null},
    {k:"b",title:"Hours worked against hours booked, per week",get:p=>{const r=bvFor(p,ST.per);return r?r.d:null},band:bandB,lo:-20,hi:40,ticks:[-20,-10,0,10,20,30,40],fmt:v=>(v>0?"+":"")+fmt(v,1),hot:"over booked",cool:"under booked"}
  ];
}
const BCOL={far:"var(--red)",over:"var(--amber)",ok:"var(--green)",under:"var(--blue)"};
const BTXT={far:"var(--red-tint)",over:"var(--amber-tint)",ok:"var(--green-tint)",under:"var(--blue-tint)"};

/* ---------- strips ---------- */
function pool(withSearch){const q=withSearch?ST.q.toLowerCase():"";return P.filter(p=>(ST.gate||!p.gx)&&(ST.lvl==="All"||p.level===ST.lvl)&&(ST.dept==="All"||p.dept===ST.dept)&&(!q||p.name.toLowerCase().includes(q)||p.role.toLowerCase().includes(q)))}
function strip(m,d){
  const W=640,H=62,pl=12,pr=12,r=4.6,step=9.6;
  const ppl=P.filter(p=>(ST.gate||!p.gx)&&p.dept===d&&(ST.lvl==="All"||p.level===ST.lvl));
  const vals=ppl.map(p=>({p,v:m.get(p)})).filter(x=>x.v!=null).sort((a,b)=>a.v-b.v);
  const X=v=>pl+(W-pl-pr)*(Math.min(m.hi,Math.max(m.lo,v))-m.lo)/(m.hi-m.lo);
  let bg="",start=0;const probe=[];for(let i=0;i<=160;i++){const v=m.lo+(m.hi-m.lo)*i/160;probe.push([v,m.band(v)])}
  for(let i=1;i<=probe.length;i++){if(i===probe.length||probe[i][1]!==probe[start][1]){const b=probe[start][1],x0=X(probe[start][0]),x1=X(probe[i-1][0]);bg+=`<rect x="${x0}" y="2" width="${Math.max(0,x1-x0)}" height="${H-4}" fill="${BTXT[b]}" opacity=".75"/>`;start=i}}
  const placed=[];let dots="";const cnt={far:0,over:0,ok:0,under:0};
  vals.forEach(x=>{const cx=X(x.v);let cy=H/2;
    for(let k=0;k<9;k++){const off=(k===0?0:(k%2?1:-1)*Math.ceil(k/2))*step,y=H/2+off;if(y<r+2||y>H-r-2)continue;if(placed.every(q=>Math.hypot(q.x-cx,q.y-y)>=2*r-0.4)){cy=y;break}}
    placed.push({x:cx,y:cy});const b=m.band(x.v);cnt[b]++;
    dots+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="${BCOL[b]}" stroke="var(--surface)" stroke-width="1" data-pid="${x.p.id}" data-open="${x.p.id}" tabindex="0" role="button" aria-label="${esc(x.p.name)}, ${esc(m.fmt(x.v))}"><title>${esc(x.p.name)}, ${esc(x.p.role)}: ${esc(m.fmt(x.v))}</title></circle>`});
  const hot=cnt.far+cnt.over;
  const parts=m.hot?[`<span class="${hot?"hot":""}"><b>${hot}</b> ${m.hot}</span>`]:[`<span class="sub">median <b>${fmt(median(vals.map(x=>x.v)),1)}</b></span>`];if(m.cool)parts.push(`<span class="${cnt.under?"cool":""}"><b>${cnt.under}</b> ${m.cool}</span>`);parts.push(`<span class="sub">of ${vals.length}</span>`);
  return `<svg viewBox="0 0 ${W} ${H}" class="strip-svg" role="group" aria-label="${esc(d)}, ${esc(m.title)}">${bg}${dots}</svg><div class="cnt">${parts.join("")}</div>`;
}
function axis(m){const W=640,H=22,pl=12,pr=12,X=v=>pl+(W-pl-pr)*(v-m.lo)/(m.hi-m.lo);
  return `<svg viewBox="0 0 ${W} ${H}" class="strip-svg">${m.ticks.map(t=>`<line x1="${X(t)}" x2="${X(t)}" y1="0" y2="5" stroke="var(--muted)"/><text x="${X(t)}" y="17" text-anchor="middle" style="fill:var(--muted);font-size:11px">${t}</text>`).join("")}</svg>`}

/* ---------- chart helper ---------- */
function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(v)));const m=v/e;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*e}
function chart(o){
  const w=o.w||640,h=o.h||200,pad={l:40,r:10,t:8,b:24},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,n=o.labels.length;
  const tot=Array(n).fill(0);o.bars.forEach(b=>b.vals.forEach((v,i)=>tot[i]+=(v||0)));
  const mx=niceMax(Math.max(1,...tot)*1.04),x=i=>pad.l+iw*(i+0.5)/n,bw=Math.max(2,iw/n*0.7),y=v=>pad.t+ih*(1-v/mx);
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.aria||"Chart")}">`;
  for(let t=0;t<=4;t++){const v=mx*t/4,yy=y(v);s+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pad.l-6}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`}
  const acc=Array(n).fill(0);
  o.bars.forEach(b=>b.vals.forEach((v,i)=>{v=v||0;if(v<=0)return;const y1=y(acc[i]+v),y0=y(acc[i]);s+=`<rect x="${x(i)-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1)}" fill="${b.color}"><title>${esc(b.name)}, ${esc(o.labels[i])}: ${fmt(v,1)}</title></rect>`;acc[i]+=v}));
  const step=o.every||Math.ceil(n/8);o.labels.forEach((lb,i)=>{if(i%step===0)s+=`<text x="${x(i)}" y="${h-7}" text-anchor="middle">${esc(lb)}</text>`});
  return s+"</svg>";
}
const legend=items=>`<div class="legend">${items.map(i=>`<span><i style="background:${i.color}"></i>${esc(i.name)}</span>`).join("")}</div>`;

/* ---------- render ---------- */
const app=document.getElementById("app");
function render(){
  if(window.FLsync)FLsync();
  if(location.hash==="#freelance"&&window.FLview){FLview();return}
  const M=measures(), E=pool(false), ET=pool(true), cur=M.find(m=>m.k===ST.m)||M[0];
  const ahead=E.filter(p=>(p.pcA||0)>0).length;
  const hv=E.map(p=>M[0].get(p)).filter(v=>v!=null), pv=E.map(p=>M[1].get(p)).filter(v=>v!=null), tv=E.map(p=>M[2].get(p)).filter(v=>v!=null), bvv=E.map(p=>M[3].get(p)).filter(v=>v!=null);
  const lines=[
    `<b>Hours per week, ${esc(hcLabel().toLowerCase())}.</b> ${hv.filter(v=>v>thrH()).length} of ${hv.length} people logged more than ${thrH()} hours a week over ${PLAB[ST.per]}, and ${hv.filter(v=>v<thrH()-10).length} logged fewer than ${thrH()-10}. The median is ${fmt(median(hv),1)}.`,
    `<b>Projects at once.</b> ${pv.filter(v=>v>=ST.thrP).length} of ${pv.length} people averaged ${ST.thrP} or more projects a week, and the median is ${fmt(median(pv),1)}.`,
    fullYear()?`<b>Time off.</b> ${tv.filter(v=>v<offThr()).length} of ${tv.length} people took fewer than ${ST.thrT} days this year, and the median is ${fmt(median(tv),1)}. ${ahead} people have time off scheduled through December.`:`<b>Time off.</b> The median is ${fmt(median(tv),1)} days in ${PLAB[ST.per].replace("Oct 31","Oct 30")}, and ${tv.filter(v=>v===0).length} of ${tv.length} people took none. Flags apply to the full year only.`,
    `<b>Booked vs worked.</b> ${bvv.filter(v=>v>=ST.thrB).length} of ${bvv.length} people logged ${ST.thrB} or more hours a week above what they were booked for over ${PLAB[ST.per]}, and ${bvv.filter(v=>v<=-ST.thrB).length} logged that much below. The median is ${(median(bvv)>0?"+":"")+fmt(median(bvv),1)} hours.`];
  const lsel=["All",...D.levels].map(x=>`<option ${x===ST.lvl?"selected":""}>${esc(x)}</option>`).join("");
  const dsel=["All",...DEPTS].map(x=>`<option ${x===ST.dept?"selected":""}>${esc(x)}</option>`).join("");
  const pbtn=PBTN.map(x=>`<button aria-pressed="${ST.per===x[0]}" data-per="${x[0]}">${x[1]}</button>`).join("");
  const mbtn=[["h","Hours per week"],["p","Projects at once"],["t","Time off"],["b","Booked vs worked"]].map(x=>`<button aria-pressed="${ST.m===x[0]}" data-m="${x[0]}">${x[1]}</button>`).join("");
  const hcbtn=ST.m==="h"?`<div class="seg" role="group" aria-label="Which hours">${HC.map(x=>`<button aria-pressed="${ST.hc===x[0]}" data-hc="${x[0]}">${x[1]}</button>`).join("")}</div>`:"";
  const opt=(arr,cur)=>arr.map(v=>`<option ${v===cur?"selected":""}>${v}</option>`).join("");
  const depts=ST.dept==="All"?DEPTS:[ST.dept];
  const rows=depts.map(d=>`<div class="strow"><div class="stname"><b>${esc(d)}</b></div><div>${strip(cur,d)}</div></div>`).join("");
  const legendBy={
    h:`<span><i style="background:var(--red)"></i>Over ${thrH()+5} hrs</span><span><i style="background:var(--amber)"></i>Over ${thrH()} hrs</span><span><i style="background:var(--green)"></i>In range</span><span><i style="background:var(--blue)"></i>Under ${thrH()-10} hrs</span>`,
    p:`<span><i style="background:var(--red)"></i>${ST.thrP+1} or more</span><span><i style="background:var(--amber)"></i>${ST.thrP} to under ${ST.thrP+1}</span><span><i style="background:var(--green)"></i>Fewer than ${ST.thrP}</span>`,
    t:fullYear()?`<span><i style="background:var(--red)"></i>Under ${fmt(ST.thrT/2,ST.thrT%2?1:0)} days</span><span><i style="background:var(--amber)"></i>Under ${ST.thrT} days</span><span><i style="background:var(--green)"></i>${ST.thrT} or more</span>`:`<span><i style="background:var(--green)"></i>PTO days taken in ${esc(PLAB[ST.per].replace("Oct 31","Oct 30"))}, from Paycom and the Gate timesheet. No flags by quarter.</span>`
    ,b:`<span><i style="background:var(--red)"></i>${2*ST.thrB}+ hrs over booked</span><span><i style="background:var(--amber)"></i>${ST.thrB}+ hrs over</span><span><i style="background:var(--green)"></i>Within ${ST.thrB} hrs</span><span><i style="background:var(--blue)"></i>${ST.thrB}+ hrs under booked</span>`
  }[cur.k];
  const flagSel={h:`<label>flag ${esc(hcLabel().toLowerCase())} above <select id="thrH">${opt([38,40,43,45,48,50],thrH())}</select> hours</label>`,p:`<label>flag projects at once at <select id="thrP">${opt([3,4,5,6],ST.thrP)}</select> or more</label>`,t:`<label>flag time off under <select id="thrT">${opt([5,8,10,12,15],ST.thrT)}</select> days a year</label>`,b:`<label>flag worked above or below booked by <select id="thrB">${opt([3,5,8,10],ST.thrB)}</select> hours a week</label>`}[cur.k];
  const projCheck=cur.k==="p"?`<label><input type="checkbox" id="allChk" ${ST.all?"checked":""}> Include internal and pitch work</label>`:"";
  const hcell=(r,k)=>r.h?`<span class="${ST.hc===k?"bd "+bandH(hoursSel(r.h)):""}">${fmt(k==="all"?r.h.t:k==="b"?r.h.b:r.h.bn,1)}</span>`:"–";
  const cols=[
    {k:"name",h:"Person",sv:r=>r.p.name,f:r=>`<div class="name"><b>${esc(r.p.name)}</b><span>${esc(r.p.role)}, ${esc(r.p.dept)}</span></div>`},
    {k:"lvl",h:"Level",sv:r=>D.levels.indexOf(r.p.level),f:r=>esc(r.p.level)},
    {k:"h",h:"Total hours",num:true,sv:r=>r.h?r.h.t:null,f:r=>hcell(r,"all")},
    {k:"b",h:"Billable hours",num:true,sv:r=>r.h?r.h.b:null,f:r=>hcell(r,"b")},
    {k:"bn",h:"Billable + new business",num:true,sv:r=>r.h?r.h.bn:null,f:r=>hcell(r,"bn")},
    {k:"nb",h:"New business hours",num:true,sv:r=>r.h?r.h.nb:null,f:r=>r.h?fmt(r.h.nb,1):"–"},
    {k:"in",h:"Internal hours",num:true,sv:r=>r.h?r.h.in:null,f:r=>r.h?fmt(r.h.in,1):"–"},
    {k:"bk",h:"Booked hours per week",num:true,sv:r=>r.bv?r.bv.b:null,f:r=>r.bv?fmt(r.bv.b,1):"–"},
    {k:"bd",h:"Worked minus booked",num:true,sv:r=>r.bv?r.bv.d:null,f:r=>r.bv?`<span class="bd ${bandB(r.bv.d)}">${(r.bv.d>0?"+":"")+fmt(r.bv.d,1)}</span>`:"–"},
    {k:"p",h:"Projects at once",num:true,sv:r=>r.p_,f:r=>r.p_==null?"–":`<span class="bd ${bandP(r.p_)}">${fmt(r.p_,1)}</span>`},
    {k:"t",h:"Time off, days",num:true,sv:r=>r.t,f:r=>r.t==null?"–":`<span class="bd ${bandT(r.t)}">${fmt(r.t,1)}</span>`},
    {k:"ahead",h:"Approved ahead, days",num:true,sv:r=>r.p.pcA,f:r=>r.p.pcA==null?"–":fmt(r.p.pcA,1)}];
  let rowsT=ET.map(p=>({p,h:hoursFor(p,ST.per),bv:bvFor(p,ST.per),p_:projFor(p,ST.per),t:offFor(p,ST.per)}));
  const sc=cols.find(c=>c.k===ST.sort.key)||cols[2];
  rowsT.sort((a,b)=>{const x=sc.sv(a),y=sc.sv(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;if(typeof x==="string")return ST.sort.dir*x.localeCompare(y);return ST.sort.dir*(x-y)});
  const th=cols.map(c=>`<th class="${c.num?"num":""}" data-sort="${c.k}" ${ST.sort.key===c.k?`aria-sort="${ST.sort.dir>0?"ascending":"descending"}"`:""}>${esc(c.h)}${ST.sort.key===c.k?`<span class="arr">${ST.sort.dir>0?"▲":"▼"}</span>`:""}</th>`).join("");
  const tb=rowsT.map(r=>`<tr data-open="${r.p.id}" tabindex="0" role="button">${cols.map(c=>`<td class="${c.num?"num":""}">${c.f(r)}</td>`).join("")}</tr>`).join("");
  app.innerHTML=`<div class="panel"><h2>What the numbers say, ${esc(PLAB[ST.per])}</h2><ul class="stand">${lines.map(l=>`<li>${l}</li>`).join("")}</ul></div>
  <div class="panel"><div class="controls"><div class="seg" role="group" aria-label="Measure">${mbtn}</div><div class="seg" role="group" aria-label="Period">${pbtn}</div>
      <label>Discipline <select id="deptSel">${dsel}</select></label><label>Level <select id="lvlSel">${lsel}</select></label>${projCheck}</div>
    ${hcbtn?`<div class="controls" style="margin-top:-4px">${hcbtn}</div>`:""}
    <div class="panel-head"><h2>${esc(cur.title)}</h2><span class="sub">Every person, one dot each. Click a dot for details.</span></div>
    <div class="legend">${legendBy}</div>
    <div class="strow axisrow"><div></div><div>${axis(cur)}</div><div></div></div>${rows}
    <div class="flags"><span>For discussion:</span>${flagSel}</div>
    ${cur.k==="t"?`<p class="sub" style="margin-top:8px">Time off is approved PTO from Paycom through Oct 30, and Gate timesheet time off for legacy Gate staff. Flags apply to the full year only, and people who joined this year are left out of the year view.</p>`:""}
    ${cur.k==="b"?`<p class="sub" style="margin-top:8px">Weeks count when the person logged 8 or more hours in total, and booked is what the resourcing plan scheduled for those weeks. Worked is client work plus new business. Internal time such as 1:1s and company meetings is left out because it is not booked. New business is never booked, so it counts as worked only. Click a dot to see the clients and projects by quarter.</p>`:""}
    ${cur.k==="h"?`<p class="sub" style="margin-top:8px">Total hours is everything logged. Billable is time on client projects, and new business is pitches and account growth.</p>`:""}</div>
  <div class="panel"><div class="controls"><label>Search <input type="search" id="qIn" value="${esc(ST.q)}" placeholder="Name or role"></label></div>
    <div class="panel-head"><h2>Details</h2><span class="sub">${rowsT.length} people. Click a column to sort and a row for the weekly picture.</span></div>
    <div class="tablewrap"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>
    <p class="sub" style="margin-top:8px">Hours per week is the average over weeks with 8 or more logged hours. Total hours is everything logged, billable is time on client projects, new business is pitches and account growth, and internal is everything else internal. Booked is the hours the resourcing plan scheduled, and worked minus booked is the average weekly difference, leaving out internal time. Time off is approved PTO from Paycom; for legacy Gate staff it is vacation, sick and personal days from the Gate timesheet. Gate staff log time by month, so their hours are spread across the days they worked each month, and their booked vs worked uses Parallax time only. Departments and levels follow the employee file.</p></div>`;
}

/* ---------- drawer ---------- */
const drawer=document.getElementById("drawer"),back=document.getElementById("back");let lastFocus=null;drawer.inert=true;
function openDrawer(html){lastFocus=document.activeElement;drawer.innerHTML=html;drawer.inert=false;drawer.classList.add("on");back.classList.add("on");drawer.setAttribute("aria-hidden","false");drawer.scrollTop=0;const c=drawer.querySelector(".close");if(c)c.focus()}

function bvSection(p){
  const dq=ST.dq,L={L8:"Last 8 weeks",Q1:"Q1",Q2:"Q2",Q3:"Q3",Q4:"Q4 to date",ytd:"Year to date"};
  const seg=`<div class="seg" role="group" aria-label="Period for booked vs worked">${Object.keys(L).map(k=>`<button aria-pressed="${dq===k}" data-dq="${k}">${L[k]}</button>`).join("")}</div>`;
  const cl={};
  for(const r of p.bvp||[]){const v=r.slice(1),pr=D.bvpr[r[0]];let b,a;if(dq==="ytd"){b=v[2]+v[4]+v[6]+v[8];a=v[3]+v[5]+v[7]+v[9]}else{const k={L8:0,Q1:1,Q2:2,Q3:3,Q4:4}[dq];b=v[2*k];a=v[2*k+1]}
    if(b+a<4)continue;const c=cl[pr[0]]||(cl[pr[0]]={b:0,a:0,rows:[]});c.b+=b;c.a+=a;c.rows.push([pr[1],b,a])}
  const names=Object.keys(cl).sort((x,y)=>(cl[y].b+cl[y].a)-(cl[x].b+cl[x].a));
  const dcell=(b,a)=>{const d=a-b;return `<span class="bd ${d>=5?"over":d<=-5?"under":""}">${(d>0?"+":"")+fmt(d)}</span>`};
  let tb=0,ta=0;
  const rows=names.map(n=>{const c=cl[n];tb+=c.b;ta+=c.a;return `<tr style="background:var(--surface2)"><td><b>${esc(n)}</b></td><td class="num"><b>${fmt(c.b)}</b></td><td class="num"><b>${fmt(c.a)}</b></td><td class="num">${dcell(c.b,c.a)}</td></tr>`+c.rows.sort((x,y)=>(y[1]+y[2])-(x[1]+x[2])).map(r=>`<tr><td style="padding-left:22px" class="sub">${esc(r[0])}</td><td class="num sub">${fmt(r[1])}</td><td class="num sub">${fmt(r[2])}</td><td class="num sub">${dcell(r[1],r[2])}</td></tr>`).join("")}).join("");
  return `<h3 style="margin:16px 0 6px">Booked vs worked, by client and project</h3><div class="controls" style="margin-bottom:8px">${seg}</div>

}
function personDrawer(p){
  ST.dp=p.id;
  const labs=D.weeks.map(w=>wkLabel(w.start));
  const h=hoursFor(p,ST.per),pj=projFor(p,ST.per),big=bigFor(p,ST.per),t=offFor(p,ST.per);
  const bill=p.hs.map((v,i)=>v+p.hu[i]);
  const kinds=[["Billable","var(--c-commit)",bill],["New business","var(--c-fl)",p.hn],["Internal","var(--c-past)",p.hi]];
  const wk=legend(kinds.map(k=>({name:k[0],color:k[1]})))+chart({labels:labs,bars:kinds.map(k=>({name:k[0],color:k[1],vals:k[2]})),every:6,h:210,aria:"Weekly hours for "+p.name});
  const c=ST.all?p.cA:p.cC,l=ST.all?p.lA:p.lC;
  const pw=legend([{name:"Core projects (8+ hours)",color:"var(--c-commit)"},{name:"Light-touch projects",color:"var(--c-pipe)"}])+chart({labels:labs,bars:[{name:"Core",color:"var(--c-commit)",vals:c},{name:"Light touch",color:"var(--c-pipe)",vals:l}],every:6,h:180,aria:"Projects per week for "+p.name});
  const szName=n=>{const z=D.projSize&&D.projSize[n];return z?({small:"Small",medium:"Medium",large:"Large",major:"Major",internal:"Internal"}[z.tier]||""):""};
  const proj=p.projects.length?`<table><thead><tr><th>Project</th><th>Size</th><th class="num">Logged, last 6 weeks</th></tr></thead><tbody>${p.projects.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(szName(x[0]))}</td><td class="num">${fmt(x[1])}</td></tr>`).join("")}</tbody></table>`:'<p class="small">No project hours in this window.</p>';
  return `<div class="drawer-head"><div><h2>${esc(p.name)}</h2><div class="sub">${esc(p.role)}, ${esc(p.dept)}, ${esc(p.level)}</div></div><button class="close" data-close>Close</button></div>
  <p class="sub" style="margin-bottom:10px">${esc(PLAB[ST.per][0].toUpperCase()+PLAB[ST.per].slice(1))}</p>
  <div class="kv"><div><b>${h?fmt(h.t,1):"–"}</b><span>total hours per week</span></div><div><b>${h?fmt(h.b,1):"–"}</b><span>billable</span></div><div><b>${h?fmt(h.nb,1):"–"}</b><span>new business</span></div><div><b>${h?fmt(h.in,1):"–"}</b><span>internal</span></div></div>
  <div class="kv"><div><b>${pj==null?"–":fmt(pj,1)}</b><span>projects at once</span></div><div><b>${big==null?"–":fmt(big,1)}</b><span>of which large or major</span></div><div><b>${t==null?"–":fmt(t,1)}</b><span>PTO days${ST.per==="latest"||ST.per==="ytd"?" this year":""}</span></div><div><b>${p.pcA==null?"–":fmt(p.pcA,1)}</b><span>approved ahead, days</span></div></div>
  ${ST.m==="b"?bvSection(p):""}
  <h3 style="margin-bottom:6px">Weekly hours</h3>${wk}
  <h3 style="margin:16px 0 6px">Projects at once, by week</h3>${pw}
  <h3 style="margin:16px 0 6px">Projects, last 6 weeks</h3>${proj}`;
}

document.addEventListener("click",e=>{
  if(e.target===back){closeDrawer();return}
  const t=e.target.closest("[data-per],[data-m],[data-hc],[data-sort],[data-open],[data-close],[data-dq]");if(!t)return;

  if(t.hasAttribute("data-m")){ST.m=t.getAttribute("data-m");render();return}
  if(t.hasAttribute("data-hc")){ST.hc=t.getAttribute("data-hc");render();return}
  if(t.hasAttribute("data-per")){ST.per=t.getAttribute("data-per");render();return}

});

document.addEventListener("change",e=>{

<script>
(function(){
"use strict";
const V=window.__v1; if(!V)return;
const DEPTS=["Account","Creative","Delivery","Design","Production","Studio","Strategy"];
const LEVELS=D.levels;
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(n,d=0)=>(n==null||isNaN(n))?"–":Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=n=>"$"+fmt(n);
const usdK=n=>n>=1e6?"$"+fmt(n/1e6,2)+"M":n>=1000?"$"+fmt(n/1000,0)+"K":"$"+fmt(n);
const dlab=iso=>{const d=new Date(iso+"T00:00:00");return MON[d.getMonth()]+" "+d.getDate()+(d.getFullYear()!==2026?", "+d.getFullYear():"")};
const sum=a=>a.reduce((s,v)=>s+(v||0),0);
const C=FL.contracts, PP=FL.people, MBD=FL.mbd, YBD=sum(MBD);
const STAFF_THR=45;
const S={dept:"All",show:"all",sort:{k:"days",dir:-1},cv:"fte",lvDept:"All",lvl:"All",tgt:32,rsort:"o"};
const inLvl=l=>S.lvl==="All"||l===S.lvl;
const gateOn=()=>V.ST.gate!==false;
const staffPool=dept=>D.people.filter(p=>(dept==="All"||p.dept===dept)&&inLvl(p.level)&&(gateOn()||!p.gx));

/* ---------- derived ---------- */
const wkMonth=D.weeks.map(w=>+w.start.slice(5,7)-1);
const staffN=dept=>staffPool(dept).length;
function staffHours(dept){
  const s=Array(12).fill(0),n=Array(12).fill(0);
  staffPool(dept).forEach(p=>{(p.hw||[]).forEach((h,i)=>{if(h>=8&&wkMonth[i]!=null){s[wkMonth[i]]+=h;n[wkMonth[i]]++}})});
  return s.map((v,i)=>n[i]>=3?v/n[i]:null);
}
const inDept=(c,dept)=>(dept==="All"||c.d===dept)&&inLvl(c.l);
const CL_=()=>C.filter(c=>inLvl(c.l)), PP_=()=>PP.filter(p=>inLvl(p.lvl));
const fteM=dept=>MBD.map((bd,m)=>sum(C.filter(c=>inDept(c,dept)).map(c=>c.b[m]))/bd);
const spendM=dept=>MBD.map((bd,m)=>sum(C.filter(c=>inDept(c,dept)).map(c=>c.m[m])));
function staffOver(dept){
  const out=[];for(let m=0;m<12;m++){let o=0,n=0;staffPool(dept).forEach(p=>{const v=(p.hw||[]).filter((h,i)=>wkMonth[i]===m&&h>=8);if(v.length>=2){n++;if(sum(v)/v.length>STAFF_THR)o++}});out.push(n?{o,n,s:o/n}:null)}return out;
}
const band=v=>v==null?"none":v.s>=1/3?"hot":v.s>=0.2?"warn":v.s>0?"ok":"room";
const totalSpend=()=>sum(CL_().map(c=>sum(c.m))), totalDays=()=>sum(CL_().map(c=>sum(c.b)));

/* ---------- headline ---------- */
function headline(){
  const fte=fteM("All"), peak=fte.indexOf(Math.max(...fte)), TD=totalDays(), TS=totalSpend(), avgFte=TD/YBD, staff=staffN("All"), PL=PP_();
  if(!PL.length)return [`No freelance contracts at this level in 2026.`];
  let hotWithFl=0,hot=0,lowWithFl=0;
  DEPTS.forEach(d=>{const h=staffOver(d),f=fteM(d);for(let m=0;m<10;m++){if(!h[m])continue;const fl=f[m]>=0.5;if(h[m].s>=0.2){hot++;if(fl)hotWithFl++}if(h[m].s===0&&fl)lowWithFl++}});
  const heavy=PL.filter(p=>p.days>=100).sort((a,b)=>b.days-a.days);
  const rep=PL.filter(p=>p.n>=3).sort((a,b)=>b.n-a.n).slice(0,3);
  const lvAll=S.lvl==="All";
  const flDir=sum(C.filter(c=>c.l!=="Associate - Senior").map(c=>sum(c.b)))/sum(C.map(c=>sum(c.b)));
  const SP=D.people.filter(p=>gateOn()||!p.gx);
  const stDir=SP.filter(p=>p.level!=="Associate - Senior").length/SP.length;
  const flSh=TD/sum(C.map(c=>sum(c.b))), stSh=staff/SP.length;
  const cl=clientRows().filter(r=>r.name!=="New business");
  const nb=clientRows().find(r=>r.name==="New business");
  const who=lvAll?"":` at ${esc(S.lvl)} level`, who2=lvAll?"":" at this level";
  const L=[
    `<b>Scale.</b> ${PL.length} freelancers${who} worked on 2026 contracts worth ${usdK(TS)}, which averages out to ${fmt(avgFte,1)} full-time people across the year next to ${staff} staff${who2}. Freelance peaked in ${MONL[peak]} at ${fmt(fte[peak],1)} full-time equivalents.`,
    hot?`<b>Where it landed.</b> In ${hot} department-months, a fifth or more of staff${who} averaged over ${STAFF_THR} hours a week, and freelancers${who2} were booked at half a person or more in ${hotWithFl} of them. They were also booked in ${lowWithFl} department-months where no one on staff${who2} went over ${STAFF_THR}.`:`<b>Where it landed.</b> No department had a fifth or more of staff${who} averaging over ${STAFF_THR} hours a week in any month.`,
    heavy.length?`<b>Effectively staff.</b> ${heavy.length} ${heavy.length===1?"person is":"people are"} booked for 100 or more days this year: ${heavy.map(p=>esc(p.name)).join(", ")}.`:`<b>Effectively staff.</b> No one${who2} is booked for 100 or more days this year.`];
  if(rep.length)L.push(`<b>Who we go back to.</b> ${rep.map((p,i)=>`${esc(p.name)} ${i?"":"has "}${p.n}${i?"":" contracts"}`).join(", ").replace(/, ([^,]*)$/," and $1")}${rep.length>1?"":" this year"}.`);
  L.push(lvAll?`<b>Seniority.</b> ${fmt(flDir*100)}% of freelance days are at director level or above, against ${fmt(stDir*100)}% of staff.`:`<b>Seniority.</b> This level is ${fmt(flSh*100)}% of freelance days and ${fmt(stSh*100)}% of staff.`);
  const RD=roomData(); if(RD.total)L.splice(2,0,`<b>Booked while staff had room.</b> In ${RD.rows.length} of the ${RD.total} department-and-level months with freelance booked, staff at the same level in the same department had half a person or more of unused time against a ${S.tgt}-hour week, about ${fmt(sum(RD.rows.map(r=>r.o)),1)} person-months of overlap.`);
  if(cl.length)L.push(`<b>Clients.</b> ${esc(cl[0].name)} takes ${fmt(cl[0].spend/TS*100)}% of this freelance spend${cl[1]?`, followed by ${esc(cl[1].name)} at ${fmt(cl[1].spend/TS*100)}%`:""}. New business pitches used ${usdK(nb?nb.spend:0)}.`);
  return L;
}

/* ---------- 1: capacity grid ---------- */
function capGrid(){
  const rows=["All",...DEPTS].map(d=>{
    const h=staffOver(d), f=fteM(d), sp=spendM(d), n=staffN(d);
    const yd=sum(C.filter(c=>inDept(c,d)).map(c=>sum(c.b)))/YBD;
    const cells=MON.map((m,i)=>{const v=S.cv==="fte"?f[i]:sp[i];const txt=S.cv==="fte"?(f[i]<0.05?"–":fmt(f[i],1)):(sp[i]<500?"–":usdK(sp[i]));
      const tip=`${d==="All"?"All departments":d}, ${MONL[i]}: ${fmt(f[i],1)} freelance FTE, ${usd(sp[i])}${h[i]?`; ${h[i].o} of ${h[i].n} staff averaged over ${STAFF_THR} hours a week`:"; no staff hours yet"}`;
      return `<td class="fc h-${band(h[i])}"><button data-flcell="${esc(d)}|${i}" aria-label="${esc(tip)}" title="${esc(tip)}">${txt}</button></td>`}).join("");
    return `<tr class="${d==="All"?"allrow":""}"><th scope="row"><b>${esc(d==="All"?"All departments":d)}</b><span>${n} staff</span></th>${cells}<td class="num"><b>${fmt(yd,1)}</b><span>${fmt(yd/(n+yd)*100)}%</span></td></tr>`}).join("");
  return `<div class="panel"><div class="panel-head"><h2>Freelance against staff hours, by month</h2><span class="sub">Each cell is freelance capacity booked that month. The color is how hard staff in that department were working.</span></div>
  <div class="controls"><div class="seg" role="group" aria-label="Show"><button aria-pressed="${S.cv==="fte"}" data-flcv="fte">Full-time equivalents</button><button aria-pressed="${S.cv==="usd"}" data-flcv="usd">Spend</button></div></div>
  <div class="legend"><span>Staff averaging over ${STAFF_THR} hrs a week:</span><span><i style="background:var(--heat-hot)"></i>A third or more</span><span><i style="background:var(--heat-warn)"></i>A fifth or more</span><span><i style="background:var(--heat-ok)"></i>Some</span><span><i style="background:var(--heat-room)"></i>None</span><span><i style="background:var(--heat-none);border:1px solid var(--line)"></i>No staff hours yet</span></div>
  <div class="tablewrap"><table class="capgrid"><thead><tr><th></th>${MON.map(m=>`<th class="num">${m}</th>`).join("")}<th class="num">Year avg<br>FTE, share</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="sub" style="margin-top:8px">Full-time equivalent is booked freelance days that month divided by working days in the month. Share is freelance as a portion of the department’s total people capacity across the year. Staff color counts people whose total logged hours averaged over ${STAFF_THR} a week that month, out of those with at least two logged weeks, through the week of Oct 26. Legacy Gate staff log time by month, so their hours are spread across the days they worked. November and December are signed contracts. Click a cell to see who was booked.</p></div>`;
}
function cellDrawer(d,m){
  const L=C.filter(c=>inDept(c,d)&&c.m[m]>0).sort((a,b)=>b.b[m]-a.b[m]);
  const h=staffHours(d)[m], o=staffOver(d)[m];
  const tr=L.map(c=>`<tr><td><b>${esc(c.p)}</b><div class="small">${esc(c.t)}${d==="All"?", "+esc(c.d):""}</div></td><td>${esc(c.cl.join(", "))}<div class="small">${esc(c.pj)}</div></td><td class="num">${fmt(c.b[m],1)}</td><td class="num">${usd(c.m[m])}</td></tr>`).join("");
  return `<div class="drawer-head"><div><h2>${esc(d==="All"?"All departments":d)}, ${MONL[m]}</h2><div class="sub">${L.length} freelancers, ${fmt(sum(L.map(c=>c.b[m])),1)} booked days, ${usd(sum(L.map(c=>c.m[m])))}</div></div><button class="close" data-close>Close</button></div>
  <div class="kv"><div><b>${fmt(fteM(d)[m],1)}</b><span>freelance FTE</span></div><div><b>${staffN(d)}</b><span>staff</span></div><div><b>${h==null?"–":fmt(h,1)}</b><span>staff hours a week, average</span></div><div><b>${o?o.o+" of "+o.n:"–"}</b><span>staff over ${STAFF_THR} hours</span></div></div>
  ${L.length?`<div class="tablewrap"><table><thead><tr><th>Freelancer</th><th>Client and project</th><th class="num">Days</th><th class="num">Spend</th></tr></thead><tbody>${tr}</tbody></table></div>`:`<p class="small">No freelancers booked this month.</p>`}`;
}

/* ---------- 2 + 3: people ---------- */
function peopleTable(){
  let L=PP_().filter(p=>S.dept==="All"||p.dept===S.dept);
  if(S.show==="staff")L=L.filter(p=>p.days>=100);
  if(S.show==="repeat")L=L.filter(p=>p.n>=2);
  const cols=[
    {k:"name",h:"Freelancer",sv:p=>p.name,f:p=>`<div class="name"><b>${esc(p.name)}</b><span>${esc(p.title)}, ${esc(p.dept)}</span></div>`},
    {k:"lvl",h:"Level",sv:p=>LEVELS.indexOf(p.lvl),f:p=>esc(p.lvl)},
    {k:"n",h:"Contracts",num:true,sv:p=>p.n,f:p=>fmt(p.n)},
    {k:"days",h:"Booked days",num:true,sv:p=>p.days,f:p=>`<span class="bd ${p.days>=100?"far":""}">${fmt(p.days)}</span>`},
    {k:"spend",h:"2026 spend",num:true,sv:p=>p.spend,f:p=>usd(p.spend)},
    {k:"run",h:"Longest continuous run",num:true,sv:p=>p.runDays,f:p=>`${fmt(p.runDays)} days<div class="small">${dlab(p.runS)} to ${dlab(p.runE)}</div>`},
    {k:"cl",h:"Clients",sv:p=>p.clients.join(","),f:p=>esc(p.clients.join(", "))}];
  const sc=cols.find(c=>c.k===S.sort.k)||cols[3];
  L=L.slice().sort((a,b)=>{const x=sc.sv(a),y=sc.sv(b);return typeof x==="string"?S.sort.dir*x.localeCompare(y):S.sort.dir*(x-y)});
  const th=cols.map(c=>`<th class="${c.num?"num":""}" data-flsort="${c.k}" ${S.sort.k===c.k?`aria-sort="${S.sort.dir>0?"ascending":"descending"}"`:""}>${esc(c.h)}${S.sort.k===c.k?`<span class="arr">${S.sort.dir>0?"▲":"▼"}</span>`:""}</th>`).join("");
  const tb=L.map(p=>`<tr data-flp="${esc(p.name)}" tabindex="0" role="button">${cols.map(c=>`<td class="${c.num?"num":""}">${c.f(p)}</td>`).join("")}</tr>`).join("");
  const dsel=["All",...DEPTS].map(x=>`<option ${x===S.dept?"selected":""}>${esc(x)}</option>`).join("");
  const seg=[["all","Everyone"],["staff","100+ booked days"],["repeat","Two or more contracts"]].map(x=>`<button aria-pressed="${S.show===x[0]}" data-flshow="${x[0]}">${x[1]}</button>`).join("");
  return `<div class="panel"><div class="panel-head"><h2>Who we rely on</h2><span class="sub">${L.length} freelancers. Click a column to sort and a row for their contracts.</span></div>
  <div class="controls"><div class="seg" role="group" aria-label="Show">${seg}</div><label>Discipline <select id="flDept">${dsel}</select></label></div>
  <div class="tablewrap"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>
  <p class="sub" style="margin-top:8px">Booked days are 2026 spend divided by the day rate, with hourly rates at 8 hours a day and half-day rates counted as half. A continuous run joins back-to-back contracts with gaps of three weeks or less, including contracts that started in 2025 or run into 2027. Contracts counts 2026 bookings only.</p></div>`;
}
function personDrawer(name){
  const p=PP.find(x=>x.name===name); if(!p)return "";
  const rate=p.days?p.spend/p.days:0;
  const tr=p.k.map(k=>`<tr><td>${dlab(k[0])} to ${dlab(k[1])}<div class="small">${esc(k[6])}</div></td><td>${esc(k[2])}<div class="small">${esc(k[3])}</div></td><td class="num">${fmt(k[5])}</td><td class="num">${usd(k[4])}</td></tr>`).join("");
  return `<div class="drawer-head"><div><h2>${esc(p.name)}</h2><div class="sub">${esc(p.title)}, ${esc(p.dept)}, ${esc(p.lvl)}${p.status.length?`. ${esc(p.status.join(", "))}`:""}</div></div><button class="close" data-close>Close</button></div>
  <div class="kv"><div><b>${fmt(p.n)}</b><span>2026 contracts</span></div><div><b>${fmt(p.days)}</b><span>booked days</span></div><div><b>${usd(p.spend)}</b><span>2026 spend</span></div><div><b>${fmt(p.runDays)}</b><span>longest run, working days</span></div></div>
  <p class="small" style="margin-bottom:14px">At an average of ${usd(rate)} a booked day, a full working year of about 230 days would cost ${usd(rate*230)}.${p.prior?` Also contracted ${p.prior} time${p.prior>1?"s":""} in 2024 and 2025.`:""}</p>
  <h3 style="margin-bottom:6px">2026 contracts</h3>
  <div class="tablewrap"><table><thead><tr><th>Dates and title</th><th>Client and project</th><th class="num">Booked days</th><th class="num">2026 spend</th></tr></thead><tbody>${tr}</tbody></table></div>`;
}


/* ---------- booked while staff had room ---------- */
function roomData(){
  const T=S.tgt, nw=Array(12).fill(0); wkMonth.forEach(m=>{if(m!=null)nw[m]++});
  const sp={}, who={}, fl={};
  staffPool("All").forEach(p=>{(p.hw||[]).forEach((h,i)=>{const m=wkMonth[i];if(m==null||m>9||h<8)return;
    const w=(p.hs[i]||0)+(p.hu[i]||0)+(p.hn[i]||0), s=Math.max(0,T-w), k=p.dept+"|"+p.level+"|"+m;
    sp[k]=(sp[k]||0)+s; const W=who[k]||(who[k]={}); const o=W[p.name]||(W[p.name]={s:0,n:0,w:0,i:0,role:p.role,gx:p.gx}); o.s+=s;o.n++;o.w+=w;o.i+=(p.hi[i]||0)})});
  CL_().forEach(c=>{for(let m=0;m<10;m++){if(!c.b[m])continue;const k=c.d+"|"+c.l+"|"+m;fl[k]=(fl[k]||0)+c.b[m]/MBD[m]}});
  const rows=[];let total=0;
  Object.keys(fl).forEach(k=>{const f=fl[k];if(f<0.3)return;total++;const [d,l,m]=k.split("|"),r=(sp[k]||0)/(T*nw[+m]);if(r>=0.5)rows.push({k,d,l,m:+m,f,r,o:Math.min(f,r),who:who[k]||{}})});
  return {rows,total,nw};
}
function roomPanel(){
  const RD=roomData(), R=RD.rows.slice().sort(S.rsort==="m"?(a,b)=>a.m-b.m||b.o-a.o:(a,b)=>b.o-a.o);
  const tsel=[30,32,35,37.5,40].map(v=>`<option value="${v}" ${v===S.tgt?"selected":""}>${v}</option>`).join("");
  const tr=R.map(r=>{const top=Object.entries(r.who).filter(x=>x[1].s/x[1].n>=4).sort((a,b)=>b[1].s/b[1].n-a[1].s/a[1].n).slice(0,3).map(x=>esc(x[0])).join(", ");
    const fls=[...new Set(C.filter(c=>c.d===r.d&&c.l===r.l&&c.b[r.m]>0).sort((a,b)=>b.b[r.m]-a.b[r.m]).map(c=>c.p))].slice(0,3).map(esc).join(", ");
    return `<tr data-flroom="${esc(r.k)}" tabindex="0" role="button"><td><b>${MONL[r.m]}</b></td><td>${esc(r.d)}<div class="small">${esc(r.l)}</div></td><td class="num">${fmt(r.f,1)}</td><td class="num">${fmt(r.r,1)}</td><td class="num"><span class="bd ${r.o>=1?"far":"over"}">${fmt(r.o,1)}</span></td><td><div class="small"><b>Booked:</b> ${fls}</div><div class="small"><b>Had room:</b> ${top||"spread across the team"}</div></td></tr>`}).join("");
  return `<div class="panel"><div class="panel-head"><h2>Booked while staff had room</h2><span class="sub">Months where freelancers were booked in a department and level whose staff had unused time. Click a row for the people.</span></div>
  <div class="controls"><label>Staff week target <select id="flTgt">${tsel}</select> hours of client and new business work</label><div class="seg" role="group" aria-label="Sort"><button aria-pressed="${S.rsort==="o"}" data-flrsort="o">Largest overlap first</button><button aria-pressed="${S.rsort==="m"}" data-flrsort="m">By month</button></div></div>
  ${R.length?`<div class="tablewrap"><table><thead><tr><th>Month</th><th>Department and level</th><th class="num">Freelance booked, FTE</th><th class="num">Staff room, FTE</th><th class="num">Overlap, FTE</th><th>Who</th></tr></thead><tbody>${tr}</tbody></table></div>`:`<p class="small">No months where freelance and unused staff time overlapped at this setting.</p>`}
  <p class="sub" style="margin-top:8px">Room is the gap between each person’s client plus new business hours and the weekly target, added up over weeks they logged 8 or more hours, so weeks off don’t count as room. A month is flagged when freelancers were booked for at least a third of a person and staff at the same department and level had at least half a person of room. It matches on department and level only, so it can’t tell whether the skills, client or timing fit; treat it as a list of questions, not answers. Staff data runs January to October.</p></div>`;
}
function roomDrawer(k){
  const RD=roomData(), r=RD.rows.find(x=>x.k===k); if(!r)return "";
  const L=C.filter(c=>c.d===r.d&&c.l===r.l&&c.b[r.m]>0).sort((a,b)=>b.b[r.m]-a.b[r.m]);
  const fr=L.map(c=>`<tr><td><b>${esc(c.p)}</b><div class="small">${esc(c.t)}</div></td><td>${esc(c.cl.join(", "))}<div class="small">${esc(c.pj)}</div></td><td class="num">${fmt(c.b[r.m],1)}</td></tr>`).join("");
  const W=Object.entries(r.who).sort((a,b)=>b[1].s/b[1].n-a[1].s/a[1].n);
  const sr=W.map(([n,o])=>`<tr><td><b>${esc(n)}</b><div class="small">${esc(o.role)}${o.gx?", legacy Gate":""}</div></td><td class="num">${fmt(o.w/o.n,1)}</td><td class="num">${fmt(o.i/o.n,1)}</td><td class="num"><span class="bd ${o.s/o.n>=8?"far":o.s/o.n>=4?"over":""}">${fmt(o.s/o.n,1)}</span></td><td class="num">${o.n}</td></tr>`).join("");
  return `<div class="drawer-head"><div><h2>${esc(r.d)}, ${MONL[r.m]}</h2><div class="sub">${esc(r.l)}. Freelance ${fmt(r.f,1)} FTE, staff room ${fmt(r.r,1)} FTE against a ${S.tgt}-hour week.</div></div><button class="close" data-close>Close</button></div>
  <h3 style="margin-bottom:6px">Freelancers booked</h3><div class="tablewrap"><table><thead><tr><th>Freelancer</th><th>Client and project</th><th class="num">Booked days</th></tr></thead><tbody>${fr}</tbody></table></div>
  <h3 style="margin:16px 0 6px">Staff at this level</h3><div class="tablewrap"><table><thead><tr><th>Person</th><th class="num">Client + new business, hrs a week</th><th class="num">Internal, hrs a week</th><th class="num">Room, hrs a week</th><th class="num">Weeks</th></tr></thead><tbody>${sr}</tbody></table></div>
  <p class="small" style="margin-top:8px">High internal hours can explain room: time on internal projects is real work, just not client or pitch work.</p>`;
}
/* ---------- 4: seniority ---------- */
function seniority(){
  const d=S.lvDept, st=D.people.filter(p=>(d==="All"||p.dept===d)&&(gateOn()||!p.gx)), fc=C.filter(c=>d==="All"||c.d===d);
  const fd=sum(fc.map(c=>sum(c.b)));
  const rows=LEVELS.map(l=>{
    const sn=st.filter(p=>p.level===l).length, ss=st.length?sn/st.length:0;
    const lc=fc.filter(c=>c.l===l), ld=sum(lc.map(c=>sum(c.b))), fs=fd?ld/fd:0;
    const tt={};lc.forEach(c=>{tt[c.t]=(tt[c.t]||0)+sum(c.b)});
    const top=Object.entries(tt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>esc(x[0])).join(", ");
    return `<div class="lvrow${S.lvl===l?" sel":""}"><div class="lvname"><b>${esc(l)}</b>${top?`<span>Freelance mostly: ${top}</span>`:""}</div>
      <div class="lvbars"><div class="lvbar"><span class="lbl">Staff</span><span class="trk"><i style="width:${ss*100}%;background:var(--c-commit)"></i></span><span class="val">${fmt(ss*100)}% (${sn})</span></div>
      <div class="lvbar"><span class="lbl">Freelance</span><span class="trk"><i style="width:${fs*100}%;background:var(--c-fl)"></i></span><span class="val">${fmt(fs*100)}% (${fmt(ld/YBD,1)} FTE)</span></div></div></div>`}).join("");
  const dsel=["All",...DEPTS].map(x=>`<option ${x===S.lvDept?"selected":""}>${esc(x)}</option>`).join("");
  return `<div class="panel"><div class="panel-head"><h2>Seniority: staff against freelance</h2><span class="sub">Share of staff headcount next to share of freelance booked days, by level. This chart always shows every level${S.lvl==="All"?"":"; the selected level is outlined"}.</span></div>
  <div class="controls"><label>Discipline <select id="flLvDept">${dsel}</select></label></div>${rows}
  <p class="sub" style="margin-top:8px">Freelance titles take the seniority the employee file gives the same title, so a freelance Account Director counts where a staff Account Director does. Titles not in the file are mapped by rule: group and VP titles to Group + VP; other director titles and executive producers to Associate Director/Director, except art directors; everyone else to Associate - Senior. Where someone’s title changed during the year, each contract counts at its own level.</p></div>`;
}

/* ---------- 5: clients ---------- */
function clientRows(){
  const m={};
  CL_().forEach(c=>{if(c.i)return;const k=c.cl.length,sp=sum(c.m),bd=sum(c.b);c.cl.forEach(n=>{const name=n==="New Business"?"New business":n;const r=m[name]||(m[name]={name,spend:0,days:0,ppl:new Set(),pj:{}});r.spend+=sp/k;r.days+=bd/k;r.ppl.add(c.p);r.pj[c.pj]=(r.pj[c.pj]||0)+sp/k})});
  return Object.values(m).sort((a,b)=>b.spend-a.spend);
}
function clients(){
  const R=clientRows(), mx=R.length?R[0].spend:1, TS=totalSpend();
  const tr=R.map(r=>`<tr data-flcl="${esc(r.name)}" tabindex="0" role="button"><td><b>${esc(r.name)}</b></td><td class="barcell"><span class="trk"><i style="width:${r.spend/mx*100}%"></i></span></td><td class="num">${usd(r.spend)}</td><td class="num">${fmt(r.spend/TS*100)}%</td><td class="num">${fmt(r.days)}</td><td class="num">${r.ppl.size}</td></tr>`).join("");
  return `<div class="panel"><div class="panel-head"><h2>Freelance spend by client</h2><span class="sub">2026, including signed contracts through December. Click a client for its projects.</span></div>
  <div class="tablewrap"><table><thead><tr><th>Client</th><th style="width:30%"></th><th class="num">Spend</th><th class="num">Share</th><th class="num">Booked days</th><th class="num">Freelancers</th></tr></thead><tbody>${tr}</tbody></table></div>
  <p class="sub" style="margin-top:8px">CHS is counted as Chase and the Capital Group spellings are combined. Contracts covering several clients are split evenly between them. Internal work is left out.</p></div>`;
}
function clientDrawer(name){
  const r=clientRows().find(x=>x.name===name); if(!r)return "";
  const pj=Object.entries(r.pj).sort((a,b)=>b[1]-a[1]).map(x=>`<tr><td>${esc(x[0]||"Unnamed")}</td><td class="num">${usd(x[1])}</td></tr>`).join("");
  const nm=name==="New business"?"New Business":name;
  const ppl=CL_().filter(c=>c.cl.includes(nm)).reduce((m,c)=>{m[c.p]=(m[c.p]||0)+sum(c.m)/c.cl.length;return m},{});
  const pr=Object.entries(ppl).sort((a,b)=>b[1]-a[1]).map(x=>`<tr><td>${esc(x[0])}</td><td class="num">${usd(x[1])}</td></tr>`).join("");
  return `<div class="drawer-head"><div><h2>${esc(name)}</h2><div class="sub">${usd(r.spend)} across ${r.ppl.size} freelancers</div></div><button class="close" data-close>Close</button></div>
  <h3 style="margin-bottom:6px">By project</h3><div class="tablewrap"><table><tbody>${pj}</tbody></table></div>
  <h3 style="margin:16px 0 6px">By freelancer</h3><div class="tablewrap"><table><tbody>${pr}</tbody></table></div>`;
}

/* ---------- view ---------- */
window.FLview=function(){
  const lseg=["All",...LEVELS].map(x=>`<button aria-pressed="${S.lvl===x}" data-fllvl="${esc(x)}">${esc(x==="All"?"All levels":x)}</button>`).join("");
  document.getElementById("app").innerHTML=`<div class="panel lvlbar"><div class="controls" style="margin:0"><span class="small">Level</span><div class="seg" role="group" aria-label="Level">${lseg}</div><span class="small">Applies to every section except the seniority chart, for freelance and staff alike.</span></div></div><div class="panel"><h2>What the numbers say, 2026${S.lvl==="All"?"":", "+esc(S.lvl)}</h2><ul class="stand">${headline().map(l=>`<li>${l}</li>`).join("")}</ul></div>${capGrid()}${roomPanel()}${peopleTable()}${seniority()}${clients()}
  <p class="sub" style="padding:0 4px 20px">Freelance data is the FL Roster tab of the freelance tracker as of Nov 5. Departments and levels follow the employee file; freelance Program Management is counted as Delivery, and the Head of Growth contract is left out.</p>`;
};
const STAFF_ASOF=document.getElementById("asof").textContent, STAFF_H1=document.querySelector(".title h1").textContent;
window.FLsync=function(){
  const fl=location.hash==="#freelance";
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-current",(b.getAttribute("data-view")==="freelance")===fl?"page":"false"));
  document.querySelector(".title h1").textContent=fl?"Freelance: who, where and how much":STAFF_H1;
  document.getElementById("asof").textContent=fl?"2026 contracts from the FL Roster, through Dec 31. Staff hours through the week of Oct 26.":STAFF_ASOF;
};
const rr=()=>V.render();
window.addEventListener("hashchange",()=>{rr();window.scrollTo(0,0)});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-view],[data-flcv],[data-flcell],[data-flsort],[data-flshow],[data-flp],[data-flcl],[data-fllvl],[data-flroom],[data-flrsort]");if(!t)return;
  if(t.hasAttribute("data-flroom")){V.openDrawer(roomDrawer(t.getAttribute("data-flroom")));return}
  if(t.hasAttribute("data-flrsort")){S.rsort=t.getAttribute("data-flrsort");rr();return}
  if(t.hasAttribute("data-fllvl")){S.lvl=t.getAttribute("data-fllvl");rr();return}
  if(t.hasAttribute("data-view")){const v=t.getAttribute("data-view");if(v==="freelance"){location.hash="freelance"}else{history.pushState("",document.title,location.pathname+location.search);rr()}return}
  if(t.hasAttribute("data-flcv")){S.cv=t.getAttribute("data-flcv");rr();return}
  if(t.hasAttribute("data-flshow")){S.show=t.getAttribute("data-flshow");rr();return}
  if(t.hasAttribute("data-flsort")){const k=t.getAttribute("data-flsort");if(S.sort.k===k)S.sort.dir*=-1;else{S.sort.k=k;S.sort.dir=(k==="name"||k==="lvl"||k==="cl")?1:-1}rr();return}
  if(t.hasAttribute("data-flcell")){const [d,m]=t.getAttribute("data-flcell").split("|");V.openDrawer(cellDrawer(d,+m));return}
  if(t.hasAttribute("data-flp")){V.openDrawer(personDrawer(t.getAttribute("data-flp")));return}
  if(t.hasAttribute("data-flcl")){V.openDrawer(clientDrawer(t.getAttribute("data-flcl")));return}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("tr[data-flp],tr[data-flcl],tr[data-flroom]")){e.preventDefault();e.target.click()}});
document.addEventListener("change",e=>{if(e.target.id==="gateChk"){V.ST.gate=e.target.checked;rr()}else if(e.target.id==="flTgt"){S.tgt=+e.target.value;rr()}else if(e.target.id==="flDept"){S.dept=e.target.value;rr()}else if(e.target.id==="flLvDept"){S.lvDept=e.target.value;rr()}});
rr();
})();
</script>
